[package]
name        = "rng-entropy"
version     = "0.5.0"
edition     = "2021"
description = "A pure-Rust statistical test suite for pseudorandom number generators (NIST SP 800-22, DIEHARD, DIEHARDER)."
license     = "BSD-2-Clause"
authors     = ["Darrell Long"]
repository  = "https://github.com/darrelllong/entropy"
readme      = "README.md"
documentation = "https://docs.rs/rng-entropy"
keywords    = ["randomness", "statistics", "rng", "diehard", "nist"]
categories  = ["algorithms", "development-tools::testing", "science"]
# MSRV derivation: u32/usize::is_multiple_of (stable 1.87, used throughout,
# including in a const assert in src/rng/stream_rng.rs) > Option::is_none_or
# (1.82, src/main.rs) > int div_ceil (1.73) > usize::ilog2 (1.67).
rust-version = "1.87"
default-run = "run_tests"
exclude = [
    "assets/**",
    "scripts/**",
    "stats/**",
    "target/**",
    "pubs/**",
    "pilot_result_*/**",
]

# Every binary reaches the cipher-backed generators (through the shared
# `src/bin/common` family), so all need the `cryptography` feature; a
# `default-features = false` build is the library alone.
[[bin]]
name = "run_tests"
path = "src/main.rs"
required-features = ["cryptography"]

[[bin]]
name = "pilot_rng"
path = "src/bin/pilot_rng.rs"
required-features = ["cryptography"]

[[bin]]
name = "dump_rng"
path = "src/bin/dump_rng.rs"
required-features = ["cryptography"]

[[bin]]
name = "webster_tavares"
path = "src/bin/webster_tavares.rs"
required-features = ["cryptography"]

[[bin]]
name = "bitplane_complexity"
path = "src/bin/bitplane_complexity.rs"
required-features = ["cryptography"]

[[bin]]
name = "bib_tests"
path = "src/bin/bib_tests.rs"
required-features = ["cryptography"]

[[bin]]
name = "gorilla"
path = "src/bin/gorilla.rs"
required-features = ["cryptography"]

[[bin]]
name = "sequential"
path = "src/bin/sequential.rs"
required-features = ["cryptography"]

[[bin]]
name = "testu01_lz"
path = "src/bin/testu01_lz.rs"
required-features = ["cryptography"]

[[bin]]
name = "upstream_tests"
path = "src/bin/upstream_tests.rs"
required-features = ["cryptography"]

# These integration tests run the binaries above, so they need the same
# feature; without it Cargo builds neither the binaries nor the tests.
[[test]]
name = "dump_rng"
path = "tests/dump_rng.rs"
required-features = ["cryptography"]

[[test]]
name = "registry"
path = "tests/registry.rs"
required-features = ["cryptography"]

[[test]]
name = "statistics"
path = "tests/statistics.rs"

[[test]]
name = "completion"
path = "tests/completion.rs"
required-features = ["cryptography"]

[lib]
name = "entropy"
path = "src/lib.rs"

[features]
# The cipher-, hash- and DRBG-backed generators and the volatile scrub of the
# OsRng buffer come from the sibling cryptography crate.  It turns on rump's
# `wipe` feature, and Cargo builds one rust-mp with the union of its
# dependants' features, so every crate that links rump beside it gets limb
# wiping.  On by default; a consumer that needs only the statistical tests and
# generators takes the crate with `default-features = false`, and then links
# neither cryptography nor rump.
default = ["cryptography"]
cryptography = ["dep:cryptography-rs"]

[dependencies]
# Side-by-side sibling checkout, matching how cryptography-rs itself takes
# rust-mp: the path serves local development, the version takes over when
# published. 0.7 pulls rump's `wipe` feature transitively, so `BigUint`
# scrubs its limbs on drop — which is why the dependency is optional; see
# the feature above.
cryptography-rs = { version = "0.7", path = "../cryptography", optional = true }
rustfft         = "6.2"

[dev-dependencies]
# Exact binary splitting of e for the test that checks the NIST e fixture.
# The probability functions that once came from rump live in entropy::math.
rust-mp         = { version = "0.3", path = "../rump" }
