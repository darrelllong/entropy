name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          # MSRV on both hosts — keep in sync with rust-version in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.87"
          - os: macos-latest
            rust: "1.87"
    defaults:
      run:
        working-directory: entropy
    steps:
      # The trio builds side-by-side: this crate's Cargo.toml takes
      # cryptography-rs from ../cryptography, which in turn takes rust-mp
      # from ../rump. Neither is on crates.io at the required version, so
      # the siblings are checked out next to this repository exactly as
      # they live on a development machine.
      #
      # Both siblings are pinned, by full SHA, to the commits this crate is
      # verified against (cryptography 49da243, rump 0c015f3), so a push to
      # either repository cannot change what CI builds.  These pins must move
      # together with any change here that needs newer siblings, and as a
      # pair, since cryptography takes rump by path.
      #
      # Pinning has a cost.  The siblings' own downstream jobs build this
      # crate's main against their HEAD but run only `cargo test`, on
      # ubuntu-latest with stable, so a sibling push that breaks this crate's
      # clippy -D warnings, docs, 1.87 build or macOS build is caught by no CI
      # until the pins move.  Moving them therefore means first running this
      # whole matrix locally against the new sibling commits: fmt, clippy,
      # tests and docs, on stable and on 1.87, on Linux and on macOS.  There
      # is deliberately no scheduled or unpinned job to catch it sooner.
      - uses: actions/checkout@v4
        with:
          path: entropy
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/cryptography
          ref: 49da2434164a1ef262514ea547ed6fcf2b041529
          path: cryptography
      - uses: actions/checkout@v4
        with:
          repository: darrelllong/rump
          ref: 0c015f34fe7693cde4703e91cf7c29bfcb982e17
          path: rump
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt && rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: entropy
      - name: Format (cargo fmt --check)
        run: cargo fmt --check
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release tests, including the release-only ones
        # Tests marked #[cfg_attr(debug_assertions, ignore)] are too slow
        # unoptimized; debug `cargo test` above skips them.  The ln Γ sweep
        # is skipped here: it needs the reference file that
        # scripts/lanczos_coefficients.py --sweep writes, and is run by hand
        # as its documentation says.
        if: matrix.rust == 'stable'
        run: cargo test --release -- --include-ignored --skip the_log_gamma_sweep_matches_high_precision
      - name: Doc build (deny missing docs)
        run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps
      - name: Tests without default features, in an empty target directory
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/no-default" cargo test --no-default-features --all-targets
  scripts:
    name: scripts (python + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (py_compile)
        run: |
          files=$(git ls-files '*.py')
          [ -n "$files" ] && python3 -m py_compile $files
      - name: Shell syntax (bash -n)
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: BENCHMARKS.md is a fixed point of make_benchmarks.py
        run: |
          python3 scripts/make_benchmarks.py
          git diff --exit-code -- BENCHMARKS.md
