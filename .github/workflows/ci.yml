name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          # MSRV — keep in sync with rust-version in Cargo.toml.
          - os: ubuntu-latest
            rust: "1.87"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy && rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Doc build (deny missing docs)
        run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps

  scripts:
    name: scripts (python + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (py_compile)
        run: |
          files=$(git ls-files '*.py')
          [ -n "$files" ] && python3 -m py_compile $files
      - name: Shell syntax (bash -n)
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: BENCHMARKS.md is a fixed point of make_benchmarks.py
        run: |
          python3 scripts/make_benchmarks.py
          git diff --exit-code -- BENCHMARKS.md
